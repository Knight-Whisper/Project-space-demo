 if(method==='POST'&&type==='documents')return apiRes({detail:'这是静态演示版：不支持真正上传文件。'},400)}
 if(/^\/issues\/\d+$/.test(path)){const i=mem.issues.find(x=>x.id===id);if(!i)return apiRes({detail:'无此事项'},404);if(method==='GET')return apiRes(issueDoc(i));if(method==='PATCH'){if(i.review_status!=='草稿')return apiRes({detail:'当前版本已锁定'},409);Object.assign(i,body);i.owner_name=mem.members.find(u=>u.id===i.owner_id)?.display_name;i.reviewer_name=mem.members.find(u=>u.id===i.reviewer_id)?.display_name;i.history.unshift({actor_name:'张工',action:'修改事项',created_at:stamp(),after_json:JSON.stringify(body)});return apiRes({ok:true})}}
 let m=path.match(/^\/issues\/(\d+)\/(submit|decision|next-version|comments)$/);
 if(m){const i=mem.issues.find(x=>x.id===Number(m[1]));if(!i)return apiRes({detail:'无此事项'},404);if(m[2]==='comments'){i.comments.push({author_name:'张工',body:body.body,created_at:stamp()});return apiRes({ok:true})}if(m[2]==='submit'){i.review_status='待确认';i.submissions.unshift({version:i.version,submitted_at:stamp(),decision:'待确认'});return apiRes({ok:true})}if(m[2]==='next-version'){i.version+=1;i.review_status='草稿';return apiRes({ok:true})}if(m[2]==='decision'){const decision=qs.includes('reject')?'已退回':'已确认';i.review_status=decision==='已确认'?'已确认':'草稿';i.submissions[0].decision=decision;i.submissions[0].decision_note=body.note;if(decision==='已退回')i.version++;return apiRes({ok:true})}}
 m=path.match(/^\/records\/(\d+)\/comments$/);
 if(m){const r=mem.records.find(x=>x.id===Number(m[1]));r?.comments.push({author_name:'张工',body:body.body,created_at:stamp()});return apiRes({ok:true})}
 if(path.endsWith('/export'))return apiRes({detail:'这是静态演示版：不支持导出多人数据。'},400);
 if(path.includes('/versions'))return apiRes({detail:'这是静态演示版：文件版本仅供浏览。'},400);
 return apiRes({detail:'这是静态演示版，当前操作未提供模拟。'},400);
};
})();
</script><script>'use strict';
const S={user:null,projects:[],dashboard:null,project:null,issues:[],records:[],documents:[],workflow:[],month:new Date().getFullYear()*12+new Date().getMonth(),day:'',tab:'issues',search:'',discipline:'全部专业',status:'全部状态',edit:false,workflowDraft:null};
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fdate=d=>d?String(d).slice(0,10):'—';
const datetime=d=>d?String(d).replace('T',' ').slice(0,16):'—';
const cleanArray=v=>Array.isArray(v)?v:[];
const statusColor=s=>s==='已确认'||s==='已完成'?'good':s==='待确认'||s==='待核实'?'warn':s==='进行中'?'blue':s==='高'?'red':'';
const badge=(t,variant)=>`<span class="badge ${variant||statusColor(t)}">${esc(t)}</span>`;
const field=(label,name,value='',type='text',extra='')=>`<div class="form-group"><label for="${esc(name)}">${esc(label)}</label><input id="${esc(name)}" name="${esc(name)}" type="${esc(type)}" class="form-input" value="${esc(value)}" ${extra}></div>`;
const sel=(label,name,values,current,extra='')=>`<div class="form-group"><label for="${esc(name)}">${esc(label)}</label><select id="${esc(name)}" name="${esc(name)}" class="form-input" ${extra}>${values.map(v=>{const [label,value]=Array.isArray(v)?v:[v,v];return `<option value="${esc(value)}" ${String(current)===String(value)?'selected':''}>${esc(label)}</option>`}).join('')}</select></div>`;
const txt=(label,name,value='',rows=3)=>`<div class="form-group"><label for="${esc(name)}">${esc(label)}</label><textarea id="${esc(name)}" name="${esc(name)}" class="form-input" rows="${rows}">${esc(value)}</textarea></div>`;
const disciplines=['规划','建筑','景观','交通','市政','结构','给排水','暖通','电气','造价','运营策划','历史风貌','室内','综合','其他'];
const issueKinds=['设计协调','现场问题','甲方反馈','资料需求','专业提资','成果节点','内部校审','外部审核','施工配合','设计变更','其他'];
const recordKinds=['会议纪要','现场踏勘','设计调整','沟通反馈','信息记录','施工配合','其他记录'];
const docKinds=['现状资料','设计条件','政策依据','图纸文件','会议纪要','成果文件','检测报告','其他资料'];
const hlink=(text,to)=>`<a href="#${to}">${esc(text)}</a>`;
const goto=r=>{location.hash='#'+r;};
function showToast(s,err=false){const e=document.getElementById('toast');e.innerHTML=`<div class="toast-msg" style="background:${err?'#9d5146':'#304b3b'}">${esc(s)}</div>`;setTimeout(()=>{e.innerHTML=''},3400)}
async function api(path,method='GET',body){const headers={};if(method!=='GET')headers['X-CSRF-Token']=S.user?.csrf||'';if(body!==undefined && !(body instanceof FormData))headers['Content-Type']='application/json';const res=await fetch('/api'+path,{method,headers,credentials:'same-origin',body:body===undefined?undefined:(body instanceof FormData?body:JSON.stringify(body))});let data;try{data=await res.json()}catch{data=null}if(!res.ok){if(res.status===401){S.user=null;loginView();throw new Error('请重新登录')}throw new Error(data?.detail||`请求失败：${res.status}`)}return data}
async function refresh(){try{S.user=await api('/me')}catch{S.user=null;loginView();return}await view()}
function loginView(){app.innerHTML=`<div class="login-page"><div class="login-cover"><div class="mark">PROJECT SPACE / INTERNAL</div><h1>让复杂项目的每一个决定，都有迹可循。</h1><p>项目、事项、会议、文件与版本历史。为建筑更新与协同工作设计的共同工作记忆。</p></div><div class="login-form-wrap"><div class="login-form"><div class="brand" style="margin-bottom:36px"><div class="brandmark">◫</div><div><div class="brand-main">PROJECT SPACE</div><div class="brand-sub">内部项目协同平台 · V0.4</div></div></div><h2>登录工作台</h2><p>使用项目管理员分配的账号</p><form id="login-form">${field('账号','username','','text','required autocomplete="username"')}${field('密码','password','','password','required autocomplete="current-password"')}<button class="btn" style="width:100%;margin-top:12px" type="submit">登录并进入工作台</button><div id="login-error"></div></form><div class="muted-box" style="margin-top:25px">这是内部开发试用版。正式接入工程资料前，请先核实单位保密、访问权限和服务器部署要求。</div></div></div></div>`}
function layout(inner,nav='home'){return `<header class="topbar"><div class="shell"><a class="brand" href="#/home"><div class="brandmark">◫</div><div><div class="brand-main">PROJECT SPACE</div><div class="brand-sub">共同工作记忆</div></div></a><div class="head-nav"><button class="${nav==='home'?'active':''}" data-action="home">项目工作台</button><button class="${nav==='projects'?'active':''}" data-action="home">全部项目</button></div><div class="userline"><span class="small subtle">${esc(S.user?.display_name||'')}</span><div class="avatar">${esc((S.user?.display_name||'用').slice(0,1))}</div><button class="btn plain sm" data-action="logout">退出</button></div></div></header><main class="shell main">${inner}</main>`}
function breadcrumbs(arr){return `<div class="breadcrumb"><button data-action="home">工作台</button>${arr.map(a=>`<span>›</span>${a.route?`<button data-action="navigate" data-route="${esc(a.route)}">${esc(a.text)}</button>`:`<strong>${esc(a.text)}</strong>`}`).join('')}</div>`}
function projectName(pid){return S.projects.find(p=>p.id===pid)?.name||'项目'}
async function loadProject(pid){S.project=await api(`/projects/${pid}`);S.issues=await api(`/projects/${pid}/issues`);S.records=await api(`/projects/${pid}/records`);S.documents=await api(`/projects/${pid}/documents`);S.workflow=await api(`/projects/${pid}/workflow`)}
async function view(){if(!S.user)return loginView();const hash=location.hash.replace(/^#\/?/,'')||'home';const parts=hash.split('/');const screen=parts[0];try{
 if(screen==='home'||screen==='projects'){S.dashboard=await api('/dashboard');S.projects=await api('/projects');renderHome()}
 else if(screen==='project'||screen==='new-issue'||screen==='new-record'||screen==='new-doc'||screen==='workflow'||screen==='members'){const pid=Number(parts[1]);if(!pid)throw Error('项目地址无效');await loadProject(pid);if(screen==='project'){S.tab=parts[2]||S.tab;renderProject()}else if(screen==='new-issue')renderIssueForm();else if(screen==='new-record')renderRecordForm();else if(screen==='new-doc')renderDocumentForm();else if(screen==='workflow')renderWorkflow();else renderMemberForm()}
 else if(screen==='issue'){const id=Number(parts[1]);const issue=await api('/issues/'+id);await loadProject(issue.project_id);renderIssue(issue)}
 else if(screen==='record'){const pid=Number(parts[1]),id=Number(parts[2]);await loadProject(pid);renderRecord(S.records.find(x=>x.id===id))}
 else if(screen==='document'){const pid=Number(parts[1]),id=Number(parts[2]);await loadProject(pid);renderDocument(S.documents.find(x=>x.id===id))}
 else if(screen==='new-project')renderProjectForm();else goto('/home');
}catch(e){app.innerHTML=layout(`<div class="card"><h2>页面暂时无法打开</h2><p class="subtle spaced">${esc(e.message)}</p><button class="btn spaced" data-action="home">返回工作台</button></div>`);showToast(e.message,true)}}
function dateKey(year,mo,d){return `${year}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function monthCalendar(){const y=Math.floor(S.month/12),m=S.month%12;const first=(new Date(y,m,1).getDay()+6)%7;const total=new Date(y,m+1,0).getDate();const events=cleanArray(S.dashboard?.milestones).filter(x=>x.due_date?.startsWith(dateKey(y,m,1).slice(0,7)));const byDay={};for(const x of events)(byDay[x.due_date]??=[]).push(x);const day=S.day||dateKey(y,m,new Date().getFullYear()===y&&new Date().getMonth()===m?new Date().getDate():1);const selected=byDay[day]||[];
let cells='';for(let i=0;i<Math.ceil((first+total)/7)*7;i++){const d=i-first+1;if(d<1||d>total){cells+='<div></div>';continue}const dt=dateKey(y,m,d),items=byDay[dt]||[];const heat=Math.min(items.length,4);cells+=`<div class="day-cell heat-${heat} ${day===dt?'active':''}"><button class="cal-number" data-action="day" data-date="${dt}">${d}</button>${items.slice(0,2).map(x=>`<button class="event" title="${esc(x.title)}" data-action="issue" data-id="${x.id}">${esc(x.title)}</button>`).join('')}${items.length>2?`<button class="more" data-action="day" data-date="${dt}">+${items.length-2} 更多</button>`:items.length===2?'':''}</div>`}
return `<div class="card"><div class="calendar-head"><div><h2>${y} 年 ${m+1} 月</h2><div class="subtle small">本月 ${events.length} 个重要节点 · 点选日期查看全部内容</div></div><div class="flex"><button class="btn ghost sm" data-action="month" data-dir="-1">‹</button><button class="btn ghost sm" data-action="today">本月</button><button class="btn ghost sm" data-action="month" data-dir="1">›</button></div></div><div class="cal-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><div class="legend">节点密度 ${[0,1,2,3,4].map(x=>`<span class="swatch heat-${x}"></span><span>${x===4?'4+':x}</span>`).join('')}</div><div class="calendar-details"><div class="between"><strong>${day.slice(5,7)}月${day.slice(8,10)}日 · ${selected.length} 项节点</strong>${selected.length>=3?badge('节点集中','warn'):''}</div>${selected.length?selected.map(x=>`<button class="event-card" data-action="issue" data-id="${x.id}"><span class="small subtle">${esc(projectName(x.project_id))} · ${esc(x.kind)}</span><div class="event-title">${esc(x.title)}</div></button>`).join(''):`<p class="subtle spaced">该日期没有已登记的重要节点。</p>`}</div></div>`}
function renderHome(){const ps=S.projects;const d=S.dashboard;const my=d.my_todo||[];app.innerHTML=layout(`<div class="between wrap"><div><p class="eyebrow">OVERVIEW / 项目总览</p><h1>项目工作台</h1><p class="subtle spaced">查看项目进展、近期任务与关键节点。</p></div>${S.user.global_role==='admin'?'<button class="btn" data-action="new-project">＋ 新建项目</button>':''}</div><div class="grid c3 sec">${[[d.stats.projects,'进行中项目'],[d.stats.open_issues,'待跟进事项'],[d.stats.awaiting_me,'待我确认']].map(x=>`<div class="card metric"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div><section class="sec"><div class="section-heading"><h2>我的项目</h2><span class="small subtle">共 ${ps.length} 个项目</span></div><div class="grid c3">${ps.map(p=>`<button class="card project-card" data-action="project" data-id="${p.id}"><div class="between"><span class="code">${esc(p.code)}</span>${badge(p.stage)}</div><h3>${esc(p.name)}</h3><div class="between small subtle"><span>${esc(p.role==='manager'?'项目负责人':p.role==='viewer'?'只读成员':'项目成员')}</span><span>${p.pending} 项待跟进　›</span></div></button>`).join('')||'<div class="empty">暂无已加入项目，请联系管理员。</div>'}</div></section><section class="sec"><div class="section-heading"><div><h2>项目节点热力日历</h2><p>全部项目叠加，颜色越深表示节点越集中</p></div></div>${monthCalendar()}</section><section class="sec two-col"><div><div class="section-heading"><h2>我的待办</h2></div><div class="card">${my.length?my.map(x=>`<button class="item-action" data-action="issue" data-id="${x.id}"><div><div class="title">${esc(x.title)}</div><div class="small subtle">${esc(projectName(x.project_id))} · ${esc(x.lead_discipline)} · ${fdate(x.due_date)}</div></div>${badge(x.work_status)}</button>`).join(''):'<div class="empty">目前没有分配给你的待办。</div>'}</div></div><div><div class="section-heading"><h2>使用提醒</h2></div><div class="card"><h3>重要资料留存的三个原则</h3><p class="subtle spaced">记录消息来源，区分待核实与已确认；文件更新说明版本变化；关键修改保留操作人与原因。</p><div class="divider"></div><p class="small subtle">当前为内部试用版。正式接入项目数据前，请由单位确认部署、存储与备份方案。</p></div></div></section>`, 'home')}
function renderProject(){const pid=S.project.id,role=S.project.my_role,issues=S.issues;const tab=['issues','records','documents','info'].includes(S.tab)?S.tab:'issues';const n=issues.filter(x=>x.work_status!=='已完成').length;let content='';if(tab==='issues')content=issueTable();else if(tab==='records')content=recordList();else if(tab==='documents')content=documentList();else content=infoView();app.innerHTML=layout(`${breadcrumbs([{text:S.project.name}])}<div class="between wrap"><div><p class="eyebrow">${esc(S.project.code)} · ${esc(S.project.stage)}</p><h1>${esc(S.project.name)}</h1><p class="subtle spaced">${esc(S.project.description||'项目成员共同的资料、事项与工作记录空间')}</p></div>${badge(role==='manager'?'项目负责人':role==='viewer'?'只读':'项目成员')}</div><div class="grid c3 sec">${[[issues.length,'全部事项'],[n,'未完成事项'],[issues.filter(x=>x.review_status==='待确认').length,'等待确认']].map(x=>`<div class="card metric"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div><div class="tabs">${[['issues','事项台账'],['records','工作记录'],['documents','资料与成果'],['info','项目信息']].map(x=>`<button data-action="tab" data-tab="${x[0]}" class="${tab===x[0]?'selected':''}">${x[1]}</button>`).join('')}</div><div class="sec">${content}</div>`, 'projects')}
function issueTable(){const role=S.project.my_role;const filt=S.issues.filter(x=>(S.discipline==='全部专业'||x.lead_discipline===S.discipline||x.related_disciplines.includes(S.discipline))&&(S.status==='全部状态'||x.work_status===S.status||x.review_status===S.status)&&(!S.search||[x.title,x.description,x.kind,x.source_party,x.lead_discipline].join(' ').toLowerCase().includes(S.search.toLowerCase())));return `<div class="section-heading"><div><h2>事项台账</h2><p>专业协调、任务跟进、内部确认与记录溯源</p></div>${role!=='viewer'?`<button class="btn" data-action="new-issue">＋ 新增事项</button>`:''}</div><div class="searchfilters"><input id="issue-search" class="form-input" placeholder="搜索事项名称、来源、说明" value="${esc(S.search)}"><select id="discipline-filter" class="form-input">${['全部专业',...disciplines].map(x=>`<option ${S.discipline===x?'selected':''}>${x}</option>`).join('')}</select><select id="status-filter" class="form-input">${['全部状态','待处理','进行中','已完成','草稿','待确认','已确认'].map(x=>`<option ${S.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn ghost" data-action="apply-filter">筛选</button><button class="btn plain" data-action="clear-filter">清空</button></div><div class="table-wrap"><table class="table"><thead><tr><th>事项名称</th><th>牵头专业</th><th>负责人</th><th>重要节点</th><th>工作状态</th><th>确认状态</th></tr></thead><tbody>${filt.map(x=>`<tr class="item-row" data-action="issue" data-id="${x.id}"><td><strong>${esc(x.title)}</strong><span class="secondary">#${x.id} · ${esc(x.kind)} ${x.impacts_design?'· 影响方案':''}</span></td><td>${esc(x.lead_discipline)}</td><td>${esc(x.owner_name||'待指定')}</td><td>${fdate(x.due_date)}</td><td>${badge(x.work_status)}</td><td>${badge(x.review_status)}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">暂无符合条件的事项。</div></td></tr>'}</tbody></table></div><p class="help">共 ${filt.length} 条事项。点击任意一行，查看详情、跟进记录及版本历史。</p>`}
function recordList(){return `<div class="section-heading"><div><h2>工作记录</h2><p>按日期留存会议、现场、设计调整及沟通信息</p></div>${S.project.my_role!=='viewer'?'<button class="btn" data-action="new-record">＋ 新建记录</button>':''}</div>${S.records.length?S.records.map(r=>`<button class="record-card" data-action="record" data-id="${r.id}"><div class="between"><span class="small subtle">${esc(r.happened_on)} · ${esc(r.author_name)}</span>${badge(r.kind)}</div><h3>${esc(r.title)}</h3><p>${esc(r.content.slice(0,160))}${r.content.length>160?'…':''}</p><div class="small subtle spaced">来源：${esc(r.source_party||'未填写')} · ${esc(r.source_status)} · ${esc(r.lead_discipline)}${r.linked_issue_ids.length?' · 关联事项 '+r.linked_issue_ids.length+' 条':''}</div></button>`).join(''):'<div class="empty">还没有工作记录。</div>'}`}
function documentList(){return `<div class="section-heading"><div><h2>资料与成果</h2><p>轻量文件上传、外部链接、版本说明与当前参考版</p></div>${S.project.my_role!=='viewer'?'<button class="btn" data-action="new-doc">＋ 新增资料</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>资料名称</th><th>专业 / 类别</th><th>当前参考版本</th><th>上传人</th><th>更新日期</th></tr></thead><tbody>${S.documents.map(doc=>{const v=doc.versions.find(x=>x.is_current)||doc.versions[0];return `<tr class="item-row" data-action="document" data-id="${doc.id}"><td><strong>${esc(doc.title)}</strong><span class="secondary">#DOC-${doc.id} · ${doc.versions.length} 个版本</span></td><td>${esc(doc.discipline)}<span class="secondary">${esc(doc.category)}</span></td><td>${badge(v?.version_label||'暂无')}</td><td>${esc(v?.uploader_name||'—')}</td><td>${fdate(v?.created_at)}</td></tr>`}).join('')||'<tr><td colspan="5"><div class="empty">还没有资料。可上传轻量 CAD、PDF、Word，或登记腾讯文档链接。</div></td></tr>'}</tbody></table></div><p class="help">“当前参考版本”与“已内部确认”是不同概念；新上传版本不会自动覆盖旧版。</p>`}
function infoView(){return `<div class="grid c2"><div class="card"><h2>项目基本信息</h2><div class="divider"></div>${[['项目名称',S.project.name],['项目编号',S.project.code],['当前阶段',S.project.stage],['项目说明',S.project.description||'未填写']].map(x=>`<div class="kv"><div class="k">${x[0]}</div><div class="v">${esc(x[1])}</div></div>`).join('')}<div class="spaced">${S.project.my_role==='manager'?`<button class="btn ghost sm" data-action="members">＋ 添加项目成员</button>`:''}</div></div><div class="card"><div class="between"><h2>项目成员</h2>${badge(S.project.members.length+' 人')}</div><div class="divider"></div>${S.project.members.map(m=>`<div class="item-action"><span>${esc(m.display_name)}</span>${badge(m.role==='manager'?'管理员':m.role==='editor'?'可编辑':'只读')}</div>`).join('')}<div class="spaced"><button class="btn ghost sm" data-action="workflow">查看审核流程模板 ›</button></div></div></div><div class="card spaced"><div class="between"><div><h2>项目数据导出</h2><p class="subtle small spaced">包含项目资料、事项、会议记录、操作历史及上传文件。</p></div>${S.project.my_role==='manager'?`<button class="btn ghost" data-action="export">↓ 导出项目归档 ZIP</button>`:badge('管理员可导出')}</div></div>`}
function projectBaseActions(){return `<button class="back" data-action="project" data-id="${S.project.id}">← 返回项目</button>`}
function renderIssue(x){const role=S.project.my_role;const editable=role!=='viewer'&&x.review_status==='草稿';const own=S.user.id===x.owner_id;const reviewer=S.user.id===x.reviewer_id;const started=x.history||[];const submissions=x.submissions||[];const issueDocs=S.documents.filter(d=>d.linked_issue_id===x.id);
 let editor=S.edit?`<form id="edit-issue-form" class="panel">${issueFields(x)}<div class="form-foot"><button class="btn ghost" type="button" data-action="cancel-edit">取消</button><button class="btn" type="submit">保存修改</button></div></form>`:`<div class="card"><h2>事项说明</h2><div class="divider"></div><div class="recordtext">${esc(x.description||'暂无说明')}</div>${editable?`<div class="spaced"><button class="btn ghost sm" data-action="edit-issue">编辑事项内容</button></div>`:''}</div>`;
app.innerHTML=layout(`${breadcrumbs([{text:S.project.name,route:'/project/'+S.project.id+'/issues'},{text:'#'+x.id+' 事项详情'}])}<div class="between wrap"><div><div class="flex wrap">${badge(x.kind)}${badge(x.work_status)}${badge(x.review_status)}${badge('V'+x.version)}</div><h1 style="margin-top:13px">${esc(x.title)}</h1><p class="subtle spaced">牵头专业：${esc(x.lead_discipline)}　·　关联专业：${esc(x.related_disciplines.join('、')||'无')}</p></div>${editable&&!S.edit?`<button class="btn ghost" data-action="edit-issue">编辑内容</button>`:''}</div><div class="meta-grid sec">${[['负责人',x.owner_name||'待指定'],['指定确认人',x.reviewer_name||'未指定'],['计划节点',fdate(x.due_date)],['优先级',x.priority],['信息来源',x.source_party||'未登记'],['来源状态',x.source_status]].map(k=>`<div class="card"><div class="small subtle">${esc(k[0])}</div><strong>${esc(k[1])}</strong></div>`).join('')}</div><div class="two-col sec"><div>${editor}<div class="card sec"><div class="between"><h2>跟进记录</h2>${badge((x.comments||[]).length+' 条')}</div><div class="divider"></div>${(x.comments||[]).map(c=>`<div class="item-action"><div><div class="small subtle">${esc(c.author_name)} · ${datetime(c.created_at)}</div><div class="recordtext">${esc(c.body)}</div></div></div>`).join('')||'<p class="subtle small">暂无补充记录。</p>'}${role!=='viewer'?`<form id="comment-form" class="spaced">${txt('添加跟进意见','body','',3)}<div class="form-foot"><button class="btn sm" type="submit">添加记录</button></div></form>`:''}</div><div class="card sec"><div class="between"><h2>关联资料</h2><button class="buttonlink" data-action="tab" data-tab="documents">查看资料库 ›</button></div><div class="divider"></div>${issueDocs.length?issueDocs.map(doc=>`<button class="item-action" data-action="document" data-id="${doc.id}"><div><div class="title">${esc(doc.title)}</div><span class="small subtle">${esc(doc.discipline)} · ${esc(doc.category)}</span></div><span>›</span></button>`).join(''):'<p class="subtle small">还没有关联文件。</p>'}</div></div><div><div class="card"><h2>提交与确认</h2><div class="divider"></div>${x.review_status==='草稿'?`<p class="small subtle">当前版本未提交。保存不等于提交；提交后版本将锁定。</p>${editable&&own?`<button class="btn spaced" data-action="submit-issue" ${!x.reviewer_id?'disabled title="尚未指定确认人"':''}>提交 V${x.version} 确认</button>`:'<p class="small spaced subtle">需由事项负责人提交。</p>'}`:x.review_status==='待确认'?`<p class="small subtle">V${x.version} 已提交，等待 ${esc(x.reviewer_name)} 确认，当前内容锁定。</p>${reviewer?`<form id="decision-form" class="spaced">${txt('确认 / 退回说明','note','',3)}<div class="row-gap"><button class="btn ghost" name="decision" value="reject" type="submit">退回修改</button><button class="btn" name="decision" value="confirm" type="submit">确认当前版本</button></div></form>`:''}`:`<p>${badge('V'+x.version+' 已内部确认','good')}</p><p class="small subtle spaced">历史确认只对对应版本有效，后续修改必须创建新版本。</p>${own&&role!=='viewer'?`<button class="btn ghost spaced" data-action="next-version">＋ 创建 V${x.version+1}</button>`:''}`}</div><div class="card sec"><h2>版本历史</h2><div class="divider"></div>${submissions.length?submissions.map(s=>`<div class="item-action"><div><strong>V${s.version}</strong><div class="small subtle">提交：${datetime(s.submitted_at)}</div>${s.decision_note?`<div class="small spaced">意见：${esc(s.decision_note)}</div>`:''}</div>${badge(s.decision)}</div>`).join(''):'<p class="small subtle">尚无已提交版本。</p>'}</div><div class="card sec"><h2>操作留痕</h2><p class="small subtle spaced">记录后台登录账号与服务器时间</p><div class="divider"></div>${started.map(h=>`<div class="history-entry"><h4>${esc(h.actor_name)} · ${esc(h.action)}</h4><p>${datetime(h.created_at)}</p>${h.after_json?`<pre>${esc(h.after_json).slice(0,850)}</pre>`:''}</div>`).join('')||'<p class="subtle">暂无操作记录。</p>'}</div></div></div>`, 'projects');}
function issueFields(x={}){const members=S.project.members;const selected=x.related_disciplines||[];return `${field('事项标题','title',x.title||'','text','required minlength="2"')}${txt('事项说明 / 修改依据','description',x.description||'',4)}<div class="form-grid">${sel('事项分类','kind',issueKinds,x.kind||'设计协调')}${sel('牵头专业','lead_discipline',disciplines,x.lead_discipline||'建筑')}${sel('事项负责人','owner_id',members.map(m=>[m.display_name,m.id]),x.owner_id||S.user.id)}${sel('指定确认人','reviewer_id',[['尚未指定',''],...members.filter(m=>m.id!==(Number(x.owner_id)||S.user.id)).map(m=>[m.display_name,m.id])],x.reviewer_id||'')}${sel('工作状态','work_status',['待处理','进行中','已完成'],x.work_status||'待处理')}${sel('优先级','priority',['高','中','低'],x.priority||'中')}${field('计划日期','due_date',x.due_date||'','date')}${sel('信息状态','source_status',['待核实','已核实','被替代','仅供参考'],x.source_status||'待核实')}${field('来源主体','source_party',x.source_party||'')}${field('获取方式','source_channel',x.source_channel||'')}</div><div class="form-group"><label>关联专业（可多选）</label>${disciplines.map(d=>`<label class="checkline"><input name="related_disciplines" type="checkbox" value="${d}" ${selected.includes(d)?'checked':''}>${d}</label>`).join('')}</div><label class="checkline"><input type="checkbox" name="is_milestone" ${x.is_milestone?'checked':''}>作为首页重要节点（日历中展示）</label><label class="checkline"><input type="checkbox" name="impacts_design" ${x.impacts_design?'checked':''}>影响设计方案判断</label>`}
function issuePayload(form){const f=new FormData(form);const p={};for(const k of ['title','description','kind','lead_discipline','source_party','source_channel','source_status','priority','work_status','due_date'])p[k]=f.get(k)||'';p.owner_id=Number(f.get('owner_id'))||null;p.reviewer_id=Number(f.get('reviewer_id'))||null;p.due_date=p.due_date||null;p.related_disciplines=f.getAll('related_disciplines');p.is_milestone=f.has('is_milestone');p.impacts_design=f.has('impacts_design');return p}
function renderIssueForm(){app.innerHTML=layout(`${breadcrumbs([{text:S.project.name,route:'/project/'+S.project.id},{text:'新增事项'}])}<h1>新增事项</h1><p class="small subtle spaced">先登记事实与来源，后续再逐步补充确认与文件。</p><form class="card sec" id="new-issue-form">${issueFields()}<div class="form-foot"><button class="btn ghost" type="button" data-action="project" data-id="${S.project.id}">取消</button><button class="btn" type="submit">创建事项</button></div></form>`, 'projects')}
function renderRecordForm(){app.innerHTML=layout(`${breadcrumbs([{text:S.project.name,route:'/project/'+S.project.id+'/records'},{text:'新建工作记录'}])}<h1>新建工作记录</h1><p class="subtle small spaced">会议、踏勘、电话和非正式消息，都可以先留存，但不代表正式确认。</p><form class="card sec" id="new-record-form">${field('标题','title','','text','required minlength="2"')}<div class="form-grid">${sel('记录类型','kind',recordKinds,'会议纪要')}${field('发生日期','happened_on',new Date().toISOString().slice(0,10),'date','required')}${field('信息来源主体','source_party')}${sel('获取方式','source_channel',['会议','电话','微信','邮件','现场','内部讨论','其他'],'会议')}${sel('来源状态','source_status',['待核实','已核实','被替代','仅供参考'],'待核实')}${sel('牵头专业','lead_discipline',disciplines,'综合')}</div>${txt('具体内容','content','',8)}<div class="form-group"><label>关联事项（可选）</label>${S.issues.map(i=>`<label class="checkline"><input type="checkbox" value="${i.id}" name="linked_issue_ids">${esc(i.title)}</label>`).join('')||'<p class="small subtle">当前项目暂无事项。</p>'}</div><div class="form-foot"><button type="button" class="btn ghost" data-action="project" data-id="${S.project.id}">取消</button><button class="btn" type="submit">保存记录</button></div></form>`, 'projects')}
function renderRecord(x){if(!x)return goto('/project/'+S.project.id+'/records');app.innerHTML=layout(`${breadcrumbs([{text:S.project.name,route:'/project/'+S.project.id+'/records'},{text:x.title}])}<div class="flex">${badge(x.kind)}<span class="small subtle">${esc(x.happened_on)} · ${esc(x.author_name)}</span></div><h1 class="spaced">${esc(x.title)}</h1><div class="two-col sec"><div><div class="card"><h2>记录内容</h2><div class="divider"></div><div class="recordtext">${esc(x.content)}</div></div><div class="card sec"><h2>后续补充与更正</h2><p class="small subtle spaced">原始记录保留不变；新的意见按真实账号和服务器时间追加。</p><div class="divider"></div>${(x.comments||[]).map(c=>`<div class="item-action"><div><div class="small subtle">${esc(c.author_name)} · ${datetime(c.created_at)}</div><div class="recordtext">${esc(c.body)}</div></div></div>`).join('')||'<p class="small subtle">暂无补充记录。</p>'}${S.project.my_role!=='viewer'?`<form id="record-comment-form" data-id="${x.id}" class="spaced">${txt('新增补充内容','body','',3)}<div class="form-foot"><button class="btn sm" type="submit">追加补充</button></div></form>`:''}</div></div><div><div class="card"><h2>信息来源与关联</h2><div class="divider"></div>${[['来源主体',x.source_party||'未填'],['获取方式',x.source_channel||'未填'],['来源状态',x.source_status],['牵头专业',x.lead_discipline],['记录人',x.author_name]].map(a=>`<div class="kv"><div class="k">${a[0]}</div><div class="v">${esc(a[1])}</div></div>`).join('')}<div class="divider"></div><h3>关联事项</h3>${x.linked_issue_ids.length?x.linked_issue_ids.map(id=>`<button class="item-action" data-action="issue" data-id="${id}">${esc(S.issues.find(i=>i.id===id)?.title||'#'+id)} ›</button>`).join(''):'<p class="small subtle spaced">无关联事项</p>'}</div></div></div>`, 'projects')}
function renderDocumentForm(){app.innerHTML=layout(`${breadcrumbs([{text:S.project.name,route:'/project/'+S.project.id+'/documents'},{text:'新增资料'}])}<h1>新增资料与成果</h1><p class="small subtle spaced">上传轻量文件或登记外部链接。文件只在正式提交后才视为“已提交成果”。</p><form id="new-doc-form" class="card sec">${field('资料名称','title','','text','required')}${field('版本号','version_label','V01')}${txt('版本说明','description','',3)}<div class="form-grid">${sel('专业','discipline',disciplines,'建筑')}${sel('资料类型','category',docKinds,'图纸文件')}${field('资料来源主体','source_party')}${sel('关联事项','linked_issue_id',[['不关联',''],...S.issues.map(i=>[i.title,i.id])],'')}</div><div class="form-group"><label>上传文件（单个上限由服务器配置，默认25MB）</label><input type="file" name="file" class="form-input" accept=".dwg,.dxf,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.7z,.txt,.jpg,.jpeg,.png,.csv,.skp,.rvt,.ifc"><p class="help">CAD 和模型仅下载，不做在线预览。大型依赖文件请先打包 ZIP。</p></div>${field('或者填写外部链接（腾讯文档 / 企业网盘）','external_url','','url','placeholder="https://"')}<p class="muted-box">上传者与时间由后台自动记录。新文件作为当前参考版，但不会自动变为“内部已确认”。</p><div class="form-foot"><button type="button" class="btn ghost" data-action="project" data-id="${S.project.id}">取消</button><button type="submit" class="btn">保存资料</button></div></form>`, 'projects')}
function renderDocument(x){if(!x)return goto('/project/'+S.project.id+'/documents');app.innerHTML=layout(`${breadcrumbs([{text:S.project.name,route:'/project/'+S.project.id+'/documents'},{text:x.title}])}<div class="flex">${badge(x.discipline)}${badge(x.category)}</div><h1 class="spaced">${esc(x.title)}</h1><p class="small subtle spaced">来源主体：${esc(x.source_party||'未填写')}　·　关联事项：${x.linked_issue_id?`#${x.linked_issue_id}`:'无'}</p><div class="two-col sec"><div><div class="card"><div class="between"><h2>文件版本</h2>${badge(x.versions.length+' 个')}</div><div class="divider"></div>${x.versions.map(v=>`<div class="item-action"><div style="flex:1"><div class="flex wrap"><strong>${esc(v.version_label)}</strong>${v.is_current?badge('当前参考','good'):badge('历史版本')} ${badge(v.review_status)}</div><p class="small subtle spaced">${esc(v.description||'无版本说明')}</p><p class="small subtle">${esc(v.uploader_name)} · ${datetime(v.created_at)} ${v.file_name?' · '+esc(v.file_name):''}</p><div class="row-gap spaced">${v.file_name?`<a class="btn ghost sm" href="/api/documents/${x.id}/download/${v.id}">↓ 下载文件</a>`:''}${v.external_url?`<a class="btn ghost sm" href="${esc(v.external_url)}" target="_blank" rel="noopener noreferrer">↗ 外部链接</a>`:''}${S.project.my_role==='manager'&&!v.is_current?`<button class="btn ghost sm" data-action="set-current" data-doc="${x.id}" data-version="${v.id}">设为当前参考</button>`:''}</div>${v.review_status==='共享'&&v.created_by===S.user.id&&S.project.my_role!=='viewer'?`<div class="row-gap spaced"><select class="form-input" style="max-width:180px" id="doc-reviewer-${v.id}"><option value="">选择确认人</option>${S.project.members.filter(m=>m.id!==S.user.id).map(m=>`<option value="${m.id}">${esc(m.display_name)}</option>`).join('')}</select><button class="btn sm" data-action="submit-document" data-doc="${x.id}" data-version="${v.id}">提交内部确认</button></div>`:''}${v.review_status==='待确认'&&v.reviewer_id===S.user.id?`<div class="spaced"><textarea class="form-input" rows="2" id="doc-note-${v.id}" placeholder="填写确认或退回意见"></textarea><div class="row-gap spaced"><button class="btn ghost sm" data-action="decision-document" data-decision="reject" data-doc="${x.id}" data-version="${v.id}">退回</button><button class="btn sm" data-action="decision-document" data-decision="confirm" data-doc="${x.id}" data-version="${v.id}">确认该文件版本</button></div></div>`:''}${v.decision_note?`<p class="small subtle spaced">确认/退回意见：${esc(v.decision_note)}</p>`:''}</div></div>`).join('')}</div></div><div><div class="card"><h2>上传新版本</h2><div class="divider"></div>${S.project.my_role!=='viewer'?`<form id="doc-version-form" data-doc="${x.id}">${field('版本编号','version_label','V'+String(x.versions.length+1).padStart(2,'0'))}${txt('修改说明','description','',3)}<div class="form-group"><label>上传文件</label><input type="file" name="file" class="form-input" accept=".dwg,.dxf,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.7z,.txt,.jpg,.jpeg,.png,.csv,.skp,.rvt,.ifc"></div>${field('或者外部链接','external_url','','url','placeholder="https://"')}<button class="btn" type="submit">新增版本</button><p class="help">新版本不会自动覆盖当前参考版。</p></form>`:'<p class="small subtle">当前账号仅可查看和下载。</p>'}</div></div></div>`, 'projects')}
function renderWorkflow(){S.workflowDraft=S.workflow.map(x=>({name:x.name,role_name:x.role_name}));drawWorkflow()}
function drawWorkflow(){app.innerHTML=layout(`${breadcrumbs([{text:S.project.name,route:'/project/'+S.project.id+'/info'},{text:'审核流程模板'}])}<h1>审核流程模板</h1><p class="small subtle spaced">可自定义项目内部流程的节点名称与责任角色；此处是流程模板，并非已实现的自动审批引擎。</p><div class="card sec"><div id="stage-list">${S.workflowDraft.map((s,i)=>`<div class="item-action"><div><strong>${String(i+1).padStart(2,'0')}　${esc(s.name)}</strong><div class="small subtle">${esc(s.role_name)}</div></div>${S.project.my_role==='manager'?`<div class="row-gap"><button class="btn ghost sm" data-action="move-stage" data-index="${i}" data-step="-1" ${i===0?'disabled':''}>↑</button><button class="btn ghost sm" data-action="move-stage" data-index="${i}" data-step="1" ${i===S.workflowDraft.length-1?'disabled':''}>↓</button><button class="btn ghost sm" data-action="remove-stage" data-index="${i}">移除</button></div>`:''}</div>`).join('')}</div>${S.project.my_role==='manager'?`<div class="divider"></div><form id="stage-form" class="form-grid">${field('新增审核节点','name')}${field('责任角色','role_name','待指定')}<div class="form-foot" style="grid-column:1/-1"><button class="btn ghost" type="submit">＋ 添加节点</button><button class="btn" type="button" data-action="save-workflow">保存模板</button></div></form>`:''}</div>`, 'projects')}
function renderProjectForm(){app.innerHTML=layout(`${breadcrumbs([{text:'新建项目'}])}<h1>新建项目</h1><form id="new-project-form" class="card sec" style="max-width:700px">${field('项目编号','code','','text','required')}${field('项目名称','name','','text','required')}${sel('项目阶段','stage',['前期研究','方案设计','初步设计','施工图设计','施工配合','竣工归档','综合推进'],'前期研究')}${txt('项目说明','description','',4)}<button class="btn" type="submit">创建项目</button></form>`)}
function renderMemberForm(){app.innerHTML=layout(`${breadcrumbs([{text:S.project.name,route:'/project/'+S.project.id+'/info'},{text:'添加成员'}])}<h1>添加项目成员</h1><p class="small subtle spaced">新账号由管理员创建；已有账号可输入相同用户名加入本项目。</p><form id="member-form" class="card sec" style="max-width:700px">${field('登录账号','username','','text','required')}${field('显示姓名','display_name','','text','required')}${field('初始密码（新用户至少10位）','password','','password','required minlength="10"')}${sel('项目权限','role',[['管理员','manager'],['可编辑','editor'],['只读','viewer']],'editor')}<button class="btn" type="submit">添加成员</button></form>`)}

window.addEventListener('hashchange',()=>{S.edit=false;view()});
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;try{
 if(a==='home')goto('/home');
 else if(a==='project'){S.tab='issues';goto('/project/'+btn.dataset.id)}
 else if(a==='tab'){S.tab=btn.dataset.tab;goto(`/project/${S.project.id}/${S.tab}`);if(location.hash===`#/project/${S.project.id}/${S.tab}`)await view()}
 else if(a==='issue')goto('/issue/'+btn.dataset.id);
 else if(a==='record')goto(`/record/${S.project.id}/${btn.dataset.id}`);
 else if(a==='document')goto(`/document/${S.project.id}/${btn.dataset.id}`);
 else if(a==='new-project')goto('/new-project');
 else if(a==='new-issue')goto('/new-issue/'+S.project.id);
 else if(a==='new-record')goto('/new-record/'+S.project.id);
 else if(a==='new-doc')goto('/new-doc/'+S.project.id);
 else if(a==='workflow')goto('/workflow/'+S.project.id);
 else if(a==='members')goto('/members/'+S.project.id);
 else if(a==='navigate')goto(btn.dataset.route);
 else if(a==='logout'){await api('/logout','POST');S.user=null;loginView()}
 else if(a==='month'){S.month+=Number(btn.dataset.dir);S.day='';renderHome()}
 else if(a==='today'){S.month=new Date().getFullYear()*12+new Date().getMonth();S.day='';renderHome()}
 else if(a==='day'){S.day=btn.dataset.date;renderHome()}
 else if(a==='apply-filter'){S.search=document.getElementById('issue-search').value;S.discipline=document.getElementById('discipline-filter').value;S.status=document.getElementById('status-filter').value;renderProject()}
 else if(a==='clear-filter'){S.search='';S.discipline='全部专业';S.status='全部状态';renderProject()}
 else if(a==='edit-issue'){S.edit=true;const id=Number(location.hash.split('/').pop());renderIssue(await api('/issues/'+id))}
 else if(a==='cancel-edit'){S.edit=false;renderIssue(await api('/issues/'+Number(location.hash.split('/').pop())))}
 else if(a==='submit-issue'){if(confirm('提交后当前版本锁定，确认提交吗？')){await api('/issues/'+location.hash.split('/').pop()+'/submit','POST',{});showToast('已提交给指定确认人');await view()}}
 else if(a==='next-version'){if(confirm('创建下一版本后，原确认记录将保留。继续吗？')){await api('/issues/'+location.hash.split('/').pop()+'/next-version','POST',{});S.edit=true;await view()}}
 else if(a==='set-current'){await api(`/documents/${btn.dataset.doc}/current/${btn.dataset.version}`,'POST',{});showToast('已更新当前参考版本');await view()}
 else if(a==='submit-document'){const reviewer=Number(document.getElementById('doc-reviewer-'+btn.dataset.version)?.value);if(!reviewer)throw Error('请先选择确认人');await api(`/documents/${btn.dataset.doc}/versions/${btn.dataset.version}/submit`,'POST',{reviewer_id:reviewer});showToast('文件已提交内部确认');await view()}
 else if(a==='decision-document'){const note=document.getElementById('doc-note-'+btn.dataset.version)?.value?.trim();if(!note)throw Error('请填写确认或退回意见');await api(`/documents/${btn.dataset.doc}/versions/${btn.dataset.version}/decision?decision=${btn.dataset.decision}`,'POST',{note});showToast(btn.dataset.decision==='confirm'?'文件版本已确认':'文件版本已退回');await view()}
 else if(a==='remove-stage'){S.workflowDraft.splice(Number(btn.dataset.index),1);drawWorkflow()}
 else if(a==='move-stage'){const i=Number(btn.dataset.index),j=i+Number(btn.dataset.step);if(j>=0&&j<S.workflowDraft.length){[S.workflowDraft[i],S.workflowDraft[j]]=[S.workflowDraft[j],S.workflowDraft[i]];drawWorkflow()}}
 else if(a==='save-workflow'){await api('/projects/'+S.project.id+'/workflow','PUT',{stages:S.workflowDraft});showToast('审核流程模板已保存');await view()}
 else if(a==='export'){location.href='/api/projects/'+S.project.id+'/export';showToast('正在导出项目归档')}
}catch(err){showToast(err.message,true)}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;try{
 if(form.id==='login-form'){const f=new FormData(form);S.user=await api('/login','POST',{username:f.get('username'),password:f.get('password')});goto('/home');await view();return}
 if(form.id==='new-project-form'){const f=new FormData(form);const x=await api('/projects','POST',Object.fromEntries(f.entries()));goto('/project/'+x.id);return}
 if(form.id==='member-form'){const f=new FormData(form);await api(`/projects/${S.project.id}/members`,'POST',Object.fromEntries(f.entries()));showToast('项目成员已添加');goto(`/project/${S.project.id}/info`);return}
 if(form.id==='new-issue-form'){const x=await api(`/projects/${S.project.id}/issues`,'POST',issuePayload(form));showToast('事项已创建');goto('/issue/'+x.id);return}
 if(form.id==='edit-issue-form'){const id=Number(location.hash.split('/').pop());await api('/issues/'+id,'PATCH',issuePayload(form));S.edit=false;showToast('修改已保存并记录操作历史');await view();return}
 if(form.id==='comment-form'){const id=Number(location.hash.split('/').pop());const f=new FormData(form);await api('/issues/'+id+'/comments','POST',{body:f.get('body')});showToast('跟进记录已追加');await view();return}
 if(form.id==='decision-form'){const id=Number(location.hash.split('/').pop());const f=new FormData(form);const val=e.submitter?.value||'confirm';await api(`/issues/${id}/decision?decision=${val}`,'POST',{note:f.get('note')});showToast(val==='confirm'?'已确认该版本':'已退回，并保留原提交版本');await view();return}
 if(form.id==='new-record-form'){const f=new FormData(form);const payload=Object.fromEntries(f.entries());payload.linked_issue_ids=f.getAll('linked_issue_ids').map(Number);const x=await api(`/projects/${S.project.id}/records`,'POST',payload);showToast('工作记录已保存');goto(`/record/${S.project.id}/${x.id}`);return}
 if(form.id==='record-comment-form'){const id=Number(form.dataset.id);const f=new FormData(form);await api('/records/'+id+'/comments','POST',{body:f.get('body')});showToast('已追加记录，原文未被覆盖');await view();return}
 if(form.id==='new-doc-form'){const f=new FormData(form);if(!(f.get('file')?.size||f.get('external_url')))throw Error('请提供文件或外部链接');if(!f.get('file')?.size)f.delete('file');const x=await api(`/projects/${S.project.id}/documents`,'POST',f);showToast('资料已保存');goto(`/document/${S.project.id}/${x.id}`);return}
 if(form.id==='doc-version-form'){const did=Number(form.dataset.doc);const f=new FormData(form);if(!(f.get('file')?.size||f.get('external_url')))throw Error('请提供文件或外部链接');if(!f.get('file')?.size)f.delete('file');await api(`/documents/${did}/versions`,'POST',f);showToast('新版本已保存，原参考版未改变');await view();return}
 if(form.id==='stage-form'){const f=new FormData(form);if(!String(f.get('name')).trim())throw Error('节点名称不能为空');S.workflowDraft.push({name:f.get('name'),role_name:f.get('role_name')||'待指定'});drawWorkflow();return}
}catch(err){if(form.id==='login-form'){document.getElementById('login-error').innerHTML=`<div class="error">${esc(err.message)}</div>`}showToast(err.message,true)}});
refresh();
</script></body></html>
